ch(nums, left, right, target)</span><br><span class="line">    <span class="keyword">else</span></span><br><span class="line">      left = mid + <span class="number">1</span></span><br><span class="line">      <span class="keyword">return</span> binary_search(nums, left, right, target)</span><br><span class="line">    <span class="keyword">end</span></span><br><span class="line">  <span class="keyword">end</span></span><br><span class="line"></span><br><span class="line">  <span class="keyword">return</span> -<span class="number">1</span></span><br><span class="line"><span class="keyword">end</span></span><br><span class="line"></span><br><span class="line">binary_search(a, <span class="number">0</span>, <span class="number">8</span>, <span class="number">5</span>)</span><br></pre></td></tr></table></figure>
